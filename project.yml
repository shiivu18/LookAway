name: EyeBreak
options:
  bundleIdPrefix: com.eyebreak
  deploymentTarget:
    macOS: "13.0"
targets:
  EyeBreak:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: LookAway
        INFOPLIST_KEY_CFBundleDisplayName: LookAway
        PRODUCT_BUNDLE_IDENTIFIER: com.eyebreak.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/EyeBreak.entitlements
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
